<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X mock</title>
<script>
  // Frame probe: in every frame (rAF runs right before paint) record whether each target is rendered.
  window.__probe = [];
  window.__sheetAt = null;
  const targets = {
    banner: '#static-banner',
    nav: 'nav[aria-label="Primary"]',
    wtf: 'aside[aria-label="Who to follow"]',
  };
  const sheetFilled = () => {
    const s = document.querySelector('style[data-hide-it]');
    return !!(s && s.textContent.trim());
  };
  window.__sheetFilledAtHead = sheetFilled();
  new MutationObserver(() => {
    if (window.__sheetAt == null && sheetFilled()) window.__sheetAt = performance.now();
  }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  window.__gateAtHead = !!document.querySelector('style[data-hide-it-gate]');
  (function tick() {
    const rec = { t: performance.now(), op: getComputedStyle(document.documentElement).opacity };
    for (const [k, s] of Object.entries(targets)) {
      const el = document.querySelector(s);
      rec[k] = el ? (el.getClientRects().length > 0 ? 'SHOWN' : 'hidden') : null;
    }
    window.__probe.push(rec);
    if (window.__probe.length < 150) requestAnimationFrame(tick);
  })();
</script>
<style>
